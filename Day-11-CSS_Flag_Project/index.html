<!--
    Day 10 - CSS Flag Project

    In this project, I recreated the flag of Laos using HTML and CSS.
    I practiced CSS positioning, child selectors, sizing, colors,
    border-radius, and transform.
-->
    
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CSS Flag Project</title>

    <style>
        /* Flag container */
        .flag {
            background-color: #CE1126;
            width: 900px;
            height: 600px;
            position: relative;
        }

        /* Main text */
        p {
            font-size: 5rem;
            text-align: center;
            color: white;
            padding: 0;
            margin: 0;
        }

        /* Blue section */
        .flag > div {
            background-color: #002868;
            width: 100%;
            height: 50%;
            position: absolute;
            top: 150px;
        }

        /* White circle */
        .flag > div > div {
            background-color: white;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Text inside the circle */
        .flag > div > div > p {
            color: black;
        }
    </style>
</head>

<body>

    <div class="flag">
        <p>The Flag</p>

        <div>
            <div>
                <p>of Laos</p>
            </div>
        </div>
    </div>

</body>

</html>
