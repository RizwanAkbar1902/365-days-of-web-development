<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to the World!</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 text-center p-4">
          <div class="card-body">
            <span class="badge bg-primary px-3 py-2 rounded-pill mb-3">Special Milestone</span>
            <h2 class="card-title fw-bold text-dark mb-2">Welcome Baby Boy! 🍼</h2>
            <p class="card-text text-muted mb-4">
              Celebrating the birth of my nephew today. Built this quick responsive card using Bootstrap 5 utilities and layout components.
            </p>
            <div class="alert alert-info py-2 mb-0" role="alert">
              <small class="fw-semibold">Proud Chachu Milestone • August 19, 2026</small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
