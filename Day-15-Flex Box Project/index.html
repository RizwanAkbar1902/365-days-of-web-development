<!--
    Day 15 - Flexbox Pricing Table

    In this project, I practiced CSS Flexbox by creating a simple
    pricing table with three plans. I also practiced responsive
    design using a media query.
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Flexbox Pricing Table</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <style>
        body {
            font-family: "Sono", sans-serif;
        }

        .pricing-container {
            display: flex;
            width: 100%;
            justify-content: center;
            margin-top: 50px;
        }

        .pricing-plan {
            background-color: gainsboro;
            margin-left: 30px;
            border-radius: 10px;
            text-align: center;
            padding: 20px;
        }

        .blue {
            color: navy;
        }

        .plan-button {
            background-color: orange;
            border-radius: 10px;
            color: aliceblue;
            border: none;
            padding: 10px;
            width: 40%;
            font-weight: bold;
        }

        .plan-features {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .plan-title {
            font-size: 20px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .plan-price {
            font-size: 35px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .plan-features > li {
            margin-bottom: 20px;
        }

        /* Responsive layout for smaller screens */
        @media (max-width: 1250px) {
            .pricing-container {
                flex-direction: column;
                height: 100%;
                align-items: center;
            }

            .pricing-plan {
                margin-bottom: 40px;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="pricing-container">

        <div class="pricing-plan">
            <div class="plan-title">Basic</div>

            <div class="plan-price">
                $9.99/<span class="blue">month</span>
            </div>

            <ul class="plan-features">
                <li>✅ 10GB Storage</li>
                <li>✅ 1 User</li>
                <li>🚫 Support</li>
            </ul>

            <button class="plan-button">Sign Up</button>
        </div>

        <div class="pricing-plan">
            <div class="plan-title">Standard</div>

            <div class="plan-price">
                $19.99/<span class="blue">month</span>
            </div>

            <ul class="plan-features">
                <li>✅ 50GB Storage</li>
                <li>✅ 5 Users</li>
                <li>✅ Phone &amp; Email Support</li>
            </ul>

            <button class="plan-button">Sign Up</button>
        </div>

        <div class="pricing-plan">
            <div class="plan-title">Premium</div>

            <div class="plan-price">
                $49.99/<span class="blue">month</span>
            </div>

            <ul class="plan-features">
                <li>✅ 100GB Storage</li>
                <li>✅ 10 Users</li>
                <li>✅ 24/7 Support</li>
            </ul>

            <button class="plan-button">Sign Up</button>
        </div>

    </div>

</body>

</html>
