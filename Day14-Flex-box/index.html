<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Flexbox Basics Practice</title>

    <style>
        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 300px;
            border: 2px solid black;
        }

        .box {
            width: 100px;
            height: 100px;
            background-color: steelblue;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

    <h1>Flexbox Basics</h1>

    <p>
        Today I practiced the basic concepts of CSS Flexbox,
        including display, justify-content, and align-items.
    </p>

    <div class="container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
    </div>

</body>

</html>
